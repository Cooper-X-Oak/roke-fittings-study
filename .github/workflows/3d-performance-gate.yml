name: 3D Performance Gate

on:
  pull_request:
    paths:
      - ".github/workflows/3d-performance-gate.yml"
      - "docs/experiment/**"
      - "docs/engineering/3d-performance-contract.md"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "scripts/serve-static.mjs"
      - "tests/e2e/**"
      - "tests/performance-budget.json"
      - "ACCEPTANCE.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/3d-performance-gate.yml"
      - "docs/experiment/**"
      - "docs/engineering/3d-performance-contract.md"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "scripts/serve-static.mjs"
      - "tests/e2e/**"
      - "tests/performance-budget.json"
      - "ACCEPTANCE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3d-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-contract:
    name: Realtime 3D E2E contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run permanent 3D performance gates
        run: npm run test:e2e:3d

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 3d-performance-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
