version: 1
review_modes:
  draft:
    required_evidence: []
    blockers: []
  prototype:
    required_evidence:
      - "desktop screenshot at 1440x1000"
      - "runtime request and console report"
      - "scroll interaction trace at assembled, rotating, and exploded states"
      - "reduced-motion and forced-fallback evidence"
      - "asset extension and size report"
      - "keyboard focus and narrow-layout checks"
    blockers:
      - "model or decoder fails to load"
      - "scroll does not produce reversible rotation and exploded movement"
      - "core content is hidden when WebGL or JavaScript fails"
      - "runtime third-party request or unlicensed model content"
      - "primary copy or progress UI is illegible or clipped"
  release:
    required_evidence: []
    blockers: []
dimensions:
  - "product intent"
  - "interaction readiness"
  - "system craft and implementation consistency"
  - "visual expression"
  - "accessibility and responsive resilience"
iteration:
  max_rounds: 2
  plateau_window: 2
  minimum_meaningful_improvement: "Fix at least one blocking or high-impact subcheck."
  regression_tolerance: "No new blocker or loss of the previous round's passing primary path."
accepted_exceptions: []
