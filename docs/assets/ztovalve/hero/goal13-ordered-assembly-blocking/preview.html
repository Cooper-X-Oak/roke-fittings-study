          noteBody: "稳定不等于旋转小；旋转要明显，但轴和对象要明确。",

        },
        {

          name: "商业产品回正",
          noteTitle: "从结构回到产品",
          noteBody: "旋转说明结束，画面回到可采购的完整产品主视觉。",
          shellSplit: 0,
          coreSpread: 0,

          lockOpacity: 0,
        },
        {

          name: "最终商业 hold",
          noteTitle: "首页终帧",
          noteBody: "最后停成首页 hero，不接入首页，不生成 240 帧正式序列。",
          shellSplit: 0,
          coreSpread: 0,

          lockOpacity: 0,
        },
      ];

      const stage = document.querySelector("#stage");
      const canvas = document.querySelector("#hero-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(960, 540, false);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(31, 960 / 540, 0.01, 8);
      const productRig = new THREE.Group();
      const modelRoot = new THREE.Group();
      productRig.add(modelRoot);
      scene.add(productRig);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(2.4, 1.45),
        new THREE.ShadowMaterial({ color: 0x172026, opacity: 0.16 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0.16, -0.32, 0.04);
      floor.receiveShadow = true;
      scene.add(floor);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x9fa7ab, 1.42);
      const key = new THREE.DirectionalLight(0xffffff, 2.72);
      key.position.set(-0.72, 0.86, 1.18);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.near = 0.1;
      key.shadow.camera.far = 4;
      key.shadow.camera.left = -1.4;
      key.shadow.camera.right = 1.4;
      key.shadow.camera.top = 1.1;
      key.shadow.camera.bottom = -1.1;
      const rim = new THREE.DirectionalLight(0xddeeff, 2.35);
      rim.position.set(0.86, 0.35, -0.88);
      const lowFill = new THREE.DirectionalLight(0xc9d2d8, 0.95);
      lowFill.position.set(0.25, -0.2, 0.65);
      scene.add(hemi, key, rim, lowFill);

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync("../fixed-ball-valve.glb");
      modelRoot.add(gltf.scene);

      const sourceBox = new THREE.Box3().setFromObject(gltf.scene);
      const sourceCenter = sourceBox.getCenter(new THREE.Vector3());
      const sourceSize = sourceBox.getSize(new THREE.Vector3());
      gltf.scene.position.sub(sourceCenter);
      modelRoot.scale.setScalar(1.1);

      const bodyMat = new THREE.MeshPhysicalMaterial({
        color: 0x5b6469,
        metalness: 0.86,
        roughness: 0.34,
        clearcoat: 0.32,
        clearcoatRoughness: 0.46,
      });
      const darkMat = new THREE.MeshPhysicalMaterial({
        color: 0x343b40,
        metalness: 0.8,
        roughness: 0.4,
        clearcoat: 0.2,
      });
      const coreMat = new THREE.MeshPhysicalMaterial({
        color: 0xb0b8bd,
        metalness: 0.93,
        roughness: 0.26,
        clearcoat: 0.36,
      });
      const fastenerMat = new THREE.MeshPhysicalMaterial({
        color: 0x7d868b,
        metalness: 0.9,
        roughness: 0.31,
        clearcoat: 0.24,
      });
      const sealMat = new THREE.MeshPhysicalMaterial({
        color: 0x30383d,
        metalness: 0.78,
        roughness: 0.36,
        clearcoat: 0.12,
      });

      const records = [];
      const partGroups = {
        left: new THREE.Group(),
        right: new THREE.Group(),
        body: new THREE.Group(),
        core: new THREE.Group(),
        seal: new THREE.Group(),
        stem: new THREE.Group(),
        fastener: new THREE.Group(),
      };
      for (const [id, group] of Object.entries(partGroups)) {
        group.name = `goal13-${id}-group`;
        modelRoot.add(group);
      }
      const center = sourceCenter.clone();
      const size = sourceSize.clone();

      function classify(centerPoint, partSize) {
        const diagonal = partSize.length();
        if (diagonal < 0.035) return "fastener";
        if (centerPoint.y > center.y + size.y * 0.2) return "stem";
        if (Math.abs(centerPoint.x - center.x) < size.x * 0.18 && diagonal > 0.06) return "core";
        if (Math.abs(centerPoint.x - center.x) < size.x * 0.3 && diagonal < 0.105) return "seal";
        if (centerPoint.x < center.x - size.x * 0.11) return "left";
        if (centerPoint.x > center.x + size.x * 0.11) return "right";
        return "body";
      }

      const classifiedMeshes = [];
      gltf.scene.traverse((node) => {
        if (!node.isMesh) return;
        const box = new THREE.Box3().setFromObject(node);
        const partCenter = box.getCenter(new THREE.Vector3());
        const partSize = box.getSize(new THREE.Vector3());
        const group = classify(partCenter, partSize);
        const material =
          group === "fastener" ? fastenerMat.clone() :
          group === "core" ? coreMat.clone() :
          group === "seal" ? sealMat.clone() :
          group === "stem" ? bodyMat.clone() :
          group === "left" || group === "right" ? darkMat.clone() :
          bodyMat.clone();
        node.material = material;
        node.castShadow = true;
        node.receiveShadow = true;
        classifiedMeshes.push({
          node,
          group,
          localCenter: partCenter.sub(sourceCenter),
        });
      });

      modelRoot.updateMatrixWorld(true);
      for (const item of classifiedMeshes) {
        partGroups[item.group].attach(item.node);
      }
      modelRoot.updateMatrixWorld(true);
      for (const item of classifiedMeshes) {
        records.push({
          node: item.node,
          group: item.group,
          basePosition: item.node.position.clone(),
          baseRotation: item.node.rotation.clone(),
          localCenter: item.localCenter,
        });
      }

      function clamp(value) {
        return Math.max(0, Math.min(1, value));
      }

      function smoothstep(value) {
        const t = clamp(value);
        return t * t * (3 - 2 * t);
      }

      function lerp(left, right, t) {
        return left + (right - left) * t;
      }

      function lerpArray(left, right, t) {
        return left.map((value, index) => lerp(value, right[index], t));
      }

      function frameState(frame) {
        let left = KEY_STATES[0];
        let right = KEY_STATES[KEY_STATES.length - 1];
        for (let index = 0; index < KEY_STATES.length - 1; index += 1) {
          const a = KEY_STATES[index];
          const b = KEY_STATES[index + 1];
          if (frame >= a.frame && frame <= b.frame) {
            left = a;
            right = b;
            break;
          }
        }
        const segmentLength = Math.max(1, right.frame - left.frame);
        const t = smoothstep((frame - left.frame) / segmentLength);
        const numericKeys = [
          "shellSplit",
          "coreSpread",
          "sealSpread",
          "stemLift",
          "fastenerSpread",
          "coreSpin",
          "stemSpin",
          "companionSpin",
          "productYaw",
          "productX",
          "railOpacity",
          "axisOpacity",
          "lockOpacity",
        ];
        const state = {
          frame,
          name: frame < right.frame ? left.name : right.name,
          noteTitle: frame < right.frame ? left.noteTitle : right.noteTitle,
          noteBody: frame < right.frame ? left.noteBody : right.noteBody,
          camera: lerpArray(left.camera, right.camera, t),
          target: lerpArray(left.target, right.target, t),
        };
        for (const keyName of numericKeys) {
          state[keyName] = lerp(left[keyName] || 0, right[keyName] || 0, t);
        }
        return state;
      }

      function applyState(state) {
        productRig.position.set(state.productX, -0.035, 0);
        productRig.rotation.set(0, THREE.MathUtils.degToRad(state.productYaw), 0);

        for (const group of Object.values(partGroups)) {
          group.position.set(0, 0, 0);
          group.rotation.set(0, 0, 0);
        }

        partGroups.left.position.x = -state.shellSplit * 0.22;
        partGroups.right.position.x = state.shellSplit * 0.22;
        partGroups.core.position.set(0, state.coreSpread * 0.018, state.coreSpread * 0.145);
        partGroups.stem.position.set(0, state.stemLift * 0.12, state.stemLift * 0.032);
        partGroups.fastener.position.z = state.fastenerSpread * 0.012;
        partGroups.core.rotation.y = state.coreSpin * THREE.MathUtils.degToRad(88);
        partGroups.seal.rotation.y = state.companionSpin * THREE.MathUtils.degToRad(46);
        partGroups.stem.rotation.y = state.stemSpin * THREE.MathUtils.degToRad(24);

        for (const record of records) {
          const offset = new THREE.Vector3();
          const xSign = Math.sign(record.localCenter.x) || (record.group === "left" ? -1 : 1);
          const ySign = Math.sign(record.localCenter.y) || 1;
          const zSign = Math.sign(record.localCenter.z) || 1;

          if (record.group === "seal") {
            offset.x += xSign * state.sealSpread * 0.118;
            offset.z += zSign * state.sealSpread * 0.038;
          } else if (record.group === "fastener") {
            offset.x += xSign * state.fastenerSpread * 0.07;
            offset.y += ySign * state.fastenerSpread * 0.024;
            offset.z += zSign * state.fastenerSpread * 0.036;
          }

          record.node.position.copy(record.basePosition).add(offset);
          record.node.rotation.copy(record.baseRotation);
          record.node.material.opacity = 1;
          record.node.material.transparent = false;
          if (record.group === "core") {
            record.node.material.emissive = new THREE.Color(0xdce9ef).multiplyScalar(state.axisOpacity * 0.08);
          }
          if (record.group === "seal") {
            record.node.material.emissive = new THREE.Color(0xdce9ef).multiplyScalar(state.axisOpacity * 0.032);
          }
        }

        camera.position.fromArray(state.camera);
        camera.lookAt(new THREE.Vector3().fromArray(state.target));
        key.intensity = 2.12 + state.axisOpacity * 0.42 + state.lockOpacity * 0.22;
        rim.intensity = 1.7 + state.axisOpacity * 0.75;
        stage.style.setProperty("--rail-opacity", String(state.railOpacity));
        stage.style.setProperty("--axis-opacity", String(state.axisOpacity));
        stage.style.setProperty("--lock-opacity", String(state.lockOpacity));
        document.querySelector("#frame-id").textContent = String(state.frame + 1).padStart(3, "0");
        document.querySelector("#frame-name").textContent = state.name;
        document.querySelector("#side-title").textContent = state.noteTitle;
        document.querySelector("#side-body").textContent = state.noteBody;
        renderer.render(scene, camera);
      }

      const frameStates = Array.from({ length: FRAME_COUNT }, (_, frame) => frameState(frame));
      applyState(frameStates[0]);

      window.__GOAL13_BLOCKING__ = {
        waitForReady: async () => ({
          frameCount: FRAME_COUNT,
          fps: FPS,
          durationSeconds: FRAME_COUNT / FPS,
          width: 960,
          height: 540,
          model: "../fixed-ball-valve.glb",
          sourceGoal12: "../goal12-rokelike-animatic/",
          finalHoldFrames: [88, 95],
          frameSequenceRendered: false,
          fullReleaseFrameCount: 0,
          grammar: "large-scale ordered assembly blocking; stable means directed axes, not small motion; no 240-frame output",
          meshCount: records.length,
        }),
        setFrame: (frame) => {
          const bounded = Math.max(0, Math.min(FRAME_COUNT - 1, Math.round(frame)));
          const state = frameStates[bounded];
          applyState(state);
          return state;
        },
        captureFrame: (frame) => {
          const bounded = Math.max(0, Math.min(FRAME_COUNT - 1, Math.round(frame)));
          const state = frameStates[bounded];
          applyState(state);
          return {
            ...state,
            pngDataUrl: canvas.toDataURL("image/png"),
          };
        },
        frameStates,
      };
    </script>
  </body>
</html>
