<!doctype html>
<html lang="zh-CN">

    <meta charset="utf-8">

    <style>
      :root {
        color-scheme: light;
        --paper: #d8d9d6;
        --floor: #8d908d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 56% 15%, rgba(255, 255, 255, 0.82), transparent 28%),
          radial-gradient(circle at 22% 72%, rgba(255, 255, 255, 0.2), transparent 34%),
          linear-gradient(180deg, #d7d8d5 0%, var(--paper) 48%, var(--floor) 100%);
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #hero-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
    </style>

      <canvas id="hero-canvas"></canvas>
    </main>
    <div id="status">loading</div>

    <script type="module">
      import * as THREE from "../../../../local/templates/roke/assets/js/three/three.module.js";

      const ANIMATION_STATES = {

      const STILL_STATES = [
        {

          camera: [-0.5, 0.2, 1.16],

        },
        {
          id: "sandblasted-body-flange",

          name: "喷砂铸造阀体/法兰近景",
          filename: "04-sandblasted-body-flange-4k.png",
          purpose: "确认阀体/阀盖从白亮银改为不锈钢硅溶胶铸造喷砂表面。",
          camera: [-0.68, 0.245, 0.95],
          target: [-0.095, 0.03, 0.0],
          productYaw: 11,

        },
        {
          id: "fastener-seal-detail",
          stateId: "exploded",
          name: "紧固件/密封圈细节",
          filename: "05-fastener-seal-detail-4k.png",
          purpose: "确认紧固件、黑色密封/石墨填料与浅色 PTFE 视觉分层。",
          camera: [-0.36, 0.16, 0.72],
          target: [0.045, 0.015, 0.0],
          productYaw: -9,
          productX: 0.13,
          productY: -0.035,
          zoom: 1.18,
          exposure: 0.65,
          fill: 0.58,
        },
      ];

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, RENDER_WIDTH / RENDER_HEIGHT, 0.01, 6);
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.82;
      renderer.shadowMap.enabled = false;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = true;

      const pmrem = new THREE.PMREMGenerator(renderer);

      function addEnvironmentPanel(environmentScene, color, position, rotation, scale) {
        const material = new THREE.MeshBasicMaterial({
          color,
          side: THREE.DoubleSide,
          toneMapped: false,
        });
        const panel = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
        panel.position.fromArray(position);
        panel.rotation.set(rotation[0], rotation[1], rotation[2]);
        panel.scale.set(scale[0], scale[1], 1);
        environmentScene.add(panel);
      }

      function createStudioReflectionScene() {
        const environmentScene = new THREE.Scene();
        environmentScene.background = new THREE.Color(0xd7d9d6);
        addEnvironmentPanel(environmentScene, 0xffffff, [0, 1.4, -1.1], [-0.58, 0, 0], [3.2, 1.1]);
        addEnvironmentPanel(environmentScene, 0xf2f3ef, [-1.15, 0.35, -0.45], [0, 0.92, 0], [1.2, 1.6]);
        addEnvironmentPanel(environmentScene, 0xb6bab8, [1.08, 0.2, -0.52], [0, -0.9, 0], [0.74, 1.45]);
        addEnvironmentPanel(environmentScene, 0xa4aaa8, [0.9, 0.05, 0.72], [0.0, -2.1, 0], [0.22, 1.4]);
        addEnvironmentPanel(environmentScene, 0xb7bcba, [-0.82, -0.08, 0.86], [0.0, 2.12, 0], [0.18, 1.15]);
        addEnvironmentPanel(environmentScene, 0xe8e9e5, [0, -0.88, 0.05], [1.57, 0, 0], [3.0, 2.0]);
        return environmentScene;
      }

      scene.environment = pmrem.fromScene(createStudioReflectionScene(), 0.16).texture;

      const productRig = new THREE.Group();
      const modelRoot = new THREE.Group();
      productRig.add(modelRoot);
      scene.add(productRig);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(4.25, 2.55),
        new THREE.ShadowMaterial({ color: 0x8f9698, opacity: 0.075 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0.08, -0.44, -0.04);
      floor.material.depthWrite = false;
      floor.renderOrder = -10;
      floor.receiveShadow = true;
      floor.visible = false;
      scene.add(floor);

      const backdrop = new THREE.Mesh(
        new THREE.PlaneGeometry(5.4, 3.1),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.84 }),
      );
      backdrop.position.set(0.18, 0.45, -1.35);
      backdrop.visible = false;
      scene.add(backdrop);

      const ambient = new THREE.AmbientLight(0xffffff, 0.74);
      const hemi = new THREE.HemisphereLight(0xffffff, 0xb8bdbe, 1.42);
      const key = new THREE.DirectionalLight(0xffffff, 2.95);
      key.position.set(-0.76, 0.96, 1.18);
      key.castShadow = false;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 0.1;
      key.shadow.camera.far = 5;
      key.shadow.camera.left = -1.35;
      key.shadow.camera.right = 1.35;
      key.shadow.camera.top = 1.05;
      key.shadow.camera.bottom = -1.05;
      const topStrip = new THREE.DirectionalLight(0xffffff, 1.24);
      topStrip.position.set(-0.16, 1.12, 0.58);
      const rim = new THREE.DirectionalLight(0xf1f7ff, 1.28);
      rim.position.set(0.86, 0.5, -0.92);
      const sideFill = new THREE.DirectionalLight(0xdce6ea, 0.58);
      sideFill.position.set(0.46, 0.04, 0.92);
      const ballGlint = new THREE.PointLight(0xffffff, 0.72, 1.15, 2);
      ballGlint.position.set(-0.08, 0.18, 0.34);
      scene.add(ambient, hemi, key, topStrip, rim, sideFill, ballGlint);

      function makeNoiseTexture(seedOffset, options = {}) {
        const size = 256;
        const data = new Uint8Array(size * size * 4);
        let seed = 1447 + seedOffset;
        const base = options.base ?? 170;
        const spread = options.spread ?? 46;
        const repeat = options.repeat ?? 8;
        function random() {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        }
        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            const index = y * size + x;
            const grain = random();
            const band = Math.sin((x * 0.18 + y * 0.035 + seedOffset) * Math.PI) * 0.5 + 0.5;
            const mixed = options.directional ? grain * 0.7 + band * 0.3 : grain;
            const value = Math.max(0, Math.min(255, base + Math.floor(mixed * spread)));
          data[index * 4] = value;
          data[index * 4 + 1] = value;
          data[index * 4 + 2] = value;
          data[index * 4 + 3] = 255;
          }
        }
        const texture = new THREE.DataTexture(data, size, size);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(repeat, repeat);
        texture.needsUpdate = true;
        return texture;
      }

      function withMaterialId(material, materialId, anisotropy = 0) {
        material.name = `goal19-${materialId}`;
        material.userData.materialId = materialId;
        material.side = THREE.DoubleSide;
        if ("anisotropy" in material) material.anisotropy = anisotropy;
        if ("anisotropyRotation" in material) material.anisotropyRotation = Math.PI * 0.08;
        return material;
      }

      const sandblastRoughness = makeNoiseTexture(11, { base: 176, spread: 58, repeat: 18 });
      const sandblastBump = makeNoiseTexture(12, { base: 120, spread: 90, repeat: 24 });
      const machinedRoughness = makeNoiseTexture(21, { base: 158, spread: 42, repeat: 12, directional: true });
      const graphiteBump = makeNoiseTexture(31, { base: 128, spread: 76, repeat: 16 });
      const fastenerRoughness = makeNoiseTexture(41, { base: 162, spread: 46, repeat: 18, directional: true });

      const castBlastedStainlessMat = withMaterialId(new THREE.MeshPhysicalMaterial({
        color: 0x858c89,
        metalness: 0.42,
        roughness: 0.88,
        clearcoat: 0.0,
        clearcoatRoughness: 0.62,
        envMapIntensity: 0.12,
        roughnessMap: sandblastRoughness,
        bumpMap: sandblastBump,
        bumpScale: 0.014,
        emissive: 0x252b29,
        emissiveIntensity: 0.34,
      }), "castBlastedStainless", 0.12);
      const machinedStainlessMat = withMaterialId(new THREE.MeshPhysicalMaterial({
        color: 0xa9b1ae,
        metalness: 0.64,
        roughness: 0.46,
        clearcoat: 0.18,
        clearcoatRoughness: 0.2,
        envMapIntensity: 0.46,
        roughnessMap: machinedRoughness,
        emissive: 0x303534,
        emissiveIntensity: 0.18,
      }), "machinedStainless", 0.36);
      const polishedBallMat = withMaterialId(new THREE.MeshPhysicalMaterial({
        color: 0xd4d9d8,
        metalness: 1,
        roughness: 0.055,
        clearcoat: 0.58,
        clearcoatRoughness: 0.1,
        envMapIntensity: 1.18,
        emissive: 0x101313,
        emissiveIntensity: 0.035,
      }), "polishedStainlessBall", 0.1);
      const graphitePackingMat = withMaterialId(new THREE.MeshPhysicalMaterial({
        color: 0x151718,
        metalness: 0.08,
        roughness: 0.76,
        clearcoat: 0,
        envMapIntensity: 0.24,
        bumpMap: graphiteBump,
        bumpScale: 0.012,
      }), "graphitePackingDarkSeal", 0);
      const softSealPtfeMat = withMaterialId(new THREE.MeshPhysicalMaterial({
        color: 0xcfc7b5,
        metalness: 0,
        roughness: 0.58,
        clearcoat: 0.04,
        clearcoatRoughness: 0.5,
        envMapIntensity: 0.42,
        transparent: true,
        opacity: 0.98,
      }), "softSealPtfe", 0);
      const fastenerStainlessMat = withMaterialId(new THREE.MeshPhysicalMaterial({
        color: 0xbec4c1,
        metalness: 1,
        roughness: 0.31,
        clearcoat: 0.16,
        clearcoatRoughness: 0.24,
        envMapIntensity: 0.9,
        roughnessMap: fastenerRoughness,
        emissive: 0x303534,
        emissiveIntensity: 0.16,
      }), "fastenerStainless", 0.32);

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync("../fixed-ball-valve.glb");
      modelRoot.add(gltf.scene);

      const sourceBox = new THREE.Box3().setFromObject(gltf.scene);
      const sourceCenter = sourceBox.getCenter(new THREE.Vector3());
      const sourceSize = sourceBox.getSize(new THREE.Vector3());
      gltf.scene.position.sub(sourceCenter);
      modelRoot.scale.setScalar(1.12);

      const partGroups = {
        leftBody: new THREE.Group(),
        rightBody: new THREE.Group(),
        centerBody: new THREE.Group(),
        ball: new THREE.Group(),
        seat: new THREE.Group(),
        upperDrive: new THREE.Group(),
        lowerSupport: new THREE.Group(),
        fastener: new THREE.Group(),
      };

      for (const [id, group] of Object.entries(partGroups)) {
        group.name = `goal19-${id}-group`;
        modelRoot.add(group);
      }

      const center = sourceCenter.clone();
      const size = sourceSize.clone();
      const classified = [];

      function classify(partCenter, partSize) {
        const diagonal = partSize.length();
        const nearBallX = Math.abs(partCenter.x - center.x) < size.x * 0.24;
        const nearBallZ = Math.abs(partCenter.z - center.z) < size.z * 0.48;
        const yDelta = partCenter.y - center.y;
        const maxExtent = Math.max(partSize.x, partSize.y, partSize.z);
        const minExtent = Math.min(partSize.x, partSize.y, partSize.z);
        const extentRatio = minExtent / maxExtent;
        const sphereLike = extentRatio > 0.68;
        const thinAxialSeat =
          nearBallX &&
          nearBallZ &&
          diagonal > 0.09 &&
          diagonal < 0.34 &&
          extentRatio < 0.24 &&
          partSize.x < partSize.y * 0.24 &&
          partSize.x < partSize.z * 0.24;
        const trueBallCore =
          nearBallX &&
          nearBallZ &&
          sphereLike &&
          diagonal > 0.29 &&
          diagonal < 0.33 &&
          partSize.x > size.x * 0.32 &&
          yDelta > -size.y * 0.23 &&
          yDelta < size.y * 0.03;

        if (trueBallCore) return "ball";
        if (diagonal < 0.036) return "fastener";
        if (nearBallX && yDelta > size.y * 0.06 && diagonal < 0.18) return "upperDrive";
        if (nearBallX && yDelta > size.y * 0.2 && diagonal < 0.3) return "upperDrive";
        if (nearBallX && yDelta < -size.y * 0.23 && diagonal < 0.18) return "lowerSupport";
        if (thinAxialSeat) return "seat";
        if (nearBallX && diagonal < 0.12) return "seat";
        if (partCenter.x < center.x - size.x * 0.13) return "leftBody";
        if (partCenter.x > center.x + size.x * 0.13) return "rightBody";
        return "centerBody";
      }

      function materialLuminance(sourceMaterial) {
        const source = Array.isArray(sourceMaterial) ? sourceMaterial[0] : sourceMaterial;
        const color = source?.color;
        if (!color) return 1;
        return color.r * 0.2126 + color.g * 0.7152 + color.b * 0.0722;
      }

      function chooseMaterial(group, node, partCenter, partSize) {
        const diagonal = partSize.length();
        const maxExtent = Math.max(partSize.x, partSize.y, partSize.z);
        const minExtent = Math.min(partSize.x, partSize.y, partSize.z);
        const flatness = maxExtent ? minExtent / maxExtent : 1;
        const nearCore = Math.abs(partCenter.x - center.x) < size.x * 0.34;
        const darkSource = materialLuminance(node.material) < 0.33;
        const ringLike = flatness < 0.18 && diagonal > 0.08;

        if (group === "ball") return polishedBallMat.clone();
        if (group === "fastener") return fastenerStainlessMat.clone();
        if (group === "seat" && darkSource && diagonal < 0.28) return graphitePackingMat.clone();
        if (group === "seat") return softSealPtfeMat.clone();
        if (group === "upperDrive" || group === "lowerSupport") return machinedStainlessMat.clone();
        if (nearCore && ringLike && diagonal < 0.18) return machinedStainlessMat.clone();
        return castBlastedStainlessMat.clone();
      }

      gltf.scene.traverse((node) => {
        if (!node.isMesh) return;
        const box = new THREE.Box3().setFromObject(node);
        const partCenter = box.getCenter(new THREE.Vector3());
        const partSize = box.getSize(new THREE.Vector3());
        const group = classify(partCenter, partSize);
        const material = chooseMaterial(group, node, partCenter, partSize);
        if (node.geometry) {
          node.geometry.computeVertexNormals();
        }
        node.material = material;
        node.castShadow = false;
        node.receiveShadow = false;
        classified.push({
          node,
          group,
          materialClass: material.userData.materialId,
          localCenter: partCenter.clone().sub(sourceCenter),
        });
      });

      modelRoot.updateMatrixWorld(true);
      for (const item of classified) {
        partGroups[item.group].attach(item.node);
      }
      modelRoot.updateMatrixWorld(true);

      const records = classified.map((item) => ({
        node: item.node,
        group: item.group,
        materialClass: item.materialClass,
        basePosition: item.node.position.clone(),
        baseRotation: item.node.rotation.clone(),
        localCenter: item.localCenter,
      }));

      const groupCounts = records.reduce((acc, record) => {
        acc[record.group] = (acc[record.group] || 0) + 1;
        return acc;
      }, {});
      const materialCounts = records.reduce((acc, record) => {
        acc[record.materialClass] = (acc[record.materialClass] || 0) + 1;
        return acc;
      }, {});

      function applyAnimationState(animationState) {
        for (const group of Object.values(partGroups)) {
          group.position.set(0, 0, 0);
          group.rotation.set(0, 0, 0);
        }

        partGroups.leftBody.position.x = -animationState.shellSplit * 0.235;
        partGroups.rightBody.position.x = animationState.shellSplit * 0.235;
        partGroups.upperDrive.position.y = animationState.stemLift * 0.155;
        partGroups.upperDrive.position.z = animationState.stemLift * 0.035;
        partGroups.lowerSupport.position.y = -animationState.lowerDrop * 0.132;
        partGroups.lowerSupport.position.z = -animationState.lowerDrop * 0.025;
        partGroups.ball.rotation.y = animationState.ballTurn * THREE.MathUtils.degToRad(90);

        for (const record of records) {
          const offset = new THREE.Vector3();
          const xSign = Math.sign(record.localCenter.x) || 1;
          const ySign = Math.sign(record.localCenter.y) || 1;
          const zSign = Math.sign(record.localCenter.z) || 1;

          if (record.group === "seat") {
            offset.x += xSign * animationState.seatSpread * 0.1;
            offset.z += zSign * animationState.seatSpread * 0.024;
          } else if (record.group === "fastener") {
            offset.x += xSign * animationState.fastenerSpread * 0.074;
            offset.y += ySign * animationState.fastenerSpread * 0.032;
            offset.z += zSign * animationState.fastenerSpread * 0.04;
          }

          record.node.position.copy(record.basePosition).add(offset);
          record.node.rotation.copy(record.baseRotation);
        }
      }

      function applyStillState(stillState) {
        const animationState = ANIMATION_STATES[stillState.stateId];
        applyAnimationState(animationState);
        productRig.position.set(stillState.productX, stillState.productY, 0);
        productRig.rotation.set(0, THREE.MathUtils.degToRad(stillState.productYaw), 0);
        productRig.scale.setScalar(stillState.zoom);
        renderer.toneMappingExposure = stillState.exposure;
        sideFill.intensity = stillState.fill;
        camera.position.fromArray(stillState.camera);
        camera.lookAt(new THREE.Vector3().fromArray(stillState.target));
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      function setStill(index) {
        const bounded = Math.max(0, Math.min(STILL_STATES.length - 1, Math.round(index)));
        const stillState = STILL_STATES[bounded];
        applyStillState(stillState);
        return {
          ...stillState,
          animationState: ANIMATION_STATES[stillState.stateId],
        };
      }

      function setAnimationState(stateId) {
        const animationState = ANIMATION_STATES[stateId] || ANIMATION_STATES.assembled;
        applyAnimationState(animationState);
        renderer.render(scene, camera);
        return animationState;
      }

      applyStillState(STILL_STATES[0]);
      status.textContent = "ready";

      window.__GOAL19_THREEJS_MATERIAL_LOOKDEV__ = {
        waitForReady: async () => ({
          width: RENDER_WIDTH,
          height: RENDER_HEIGHT,
          stillCount: STILL_STATES.length,
          animationStateCount: Object.keys(ANIMATION_STATES).length,
          model: "../fixed-ball-valve.glb",
          modelSha256: "89024869647b3aaf3fe5301694a2753dc87e9dd3d05b41b9c651ef4e9754384b",
          stateSource: "Goal 16 animation states adapted in preview.html",
          sourceBoundary: "Original STEP, brochure, BIP, and fixed-ball-valve.glb are not modified.",
          referenceBoundary: "Supplier material terms are used as visual material direction only; this Three.js pass does not claim certified material grade.",
