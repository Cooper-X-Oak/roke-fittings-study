<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Goal 16 Stainless Catalog States Preview</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f8f6;
        --floor: #e9eceb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 58% 18%, rgba(255, 255, 255, 0.96), transparent 30%),
          linear-gradient(180deg, #ffffff 0%, var(--paper) 64%, var(--floor) 100%);
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #hero-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Goal 16 UI-free stainless catalogue render stage">
      <canvas id="hero-canvas"></canvas>
    </main>
    <div id="status">loading</div>

    <script type="module">
      import * as THREE from "../../../../local/templates/roke/assets/js/three/three.module.js";
      import { GLTFLoader } from "../../../../local/templates/roke/assets/js/three/GLTFLoader.js";
      import { RoomEnvironment } from "../../../../local/templates/roke/assets/js/three/RoomEnvironment.js";

      const RENDER_WIDTH = 3840;
      const RENDER_HEIGHT = 2160;
      const canvas = document.querySelector("#hero-canvas");
      const status = document.querySelector("#status");

      const ANIMATION_STATES = {
        assembled: {
          id: "assembled",
          label: "完整不锈钢产品",
          shellSplit: 0,
          seatSpread: 0,
          stemLift: 0,
          lowerDrop: 0,
          fastenerSpread: 0,
          ballTurn: 0,
        },
        exploded: {
          id: "exploded",
          label: "图册式轴向爆炸",
          shellSplit: 1.08,
          seatSpread: 1,
          stemLift: 0.92,
          lowerDrop: 0.78,
          fastenerSpread: 0.76,
          ballTurn: 0,
        },
        "ball-open": {
          id: "ball-open",
          label: "球体开启状态",
          shellSplit: 0.34,
          seatSpread: 0.52,
          stemLift: 0.28,
          lowerDrop: 0.22,
          fastenerSpread: 0.18,
          ballTurn: 1,
        },
        "ball-closed": {
          id: "ball-closed",
          label: "球体关闭状态",
          shellSplit: 0.34,
          seatSpread: 0.52,
          stemLift: 0.28,
          lowerDrop: 0.22,
          fastenerSpread: 0.18,
          ballTurn: 0,
        },
      };

      const STILL_STATES = [
        {
          id: "stainless-product",
          stateId: "assembled",
          name: "全不锈钢完整产品",
          filename: "01-stainless-product-4k.png",
          purpose: "确认外壳、阀体、阀盖、法兰从黑灰改为高调不锈钢图册材质。",
          camera: [-0.56, 0.25, 1.28],
          target: [0.0, 0.04, 0.0],
          productYaw: 7,
          productX: -0.015,
          productY: -0.012,
          zoom: 1,
          exposure: 0.82,
          fill: 0.74,
        },
        {
          id: "catalog-explosion",
          stateId: "exploded",
          name: "图册式轴向爆炸状态",
          filename: "02-catalog-explosion-4k.png",
          purpose: "确认后续动画可用的大尺度有序爆炸状态，左/右/上/下方向明确。",
          camera: [-0.62, 0.285, 1.72],
          target: [-0.018, 0.04, 0.0],
          productYaw: -8,
          productX: 0.12,
          productY: -0.025,
          zoom: 0.98,
          exposure: 0.84,
          fill: 0.82,
        },
        {
          id: "ball-seat-soft-seal",
          stateId: "ball-open",
          name: "球芯与浅色软密封近景",
          filename: "03-ball-seat-soft-seal-4k.png",
          purpose: "确认球芯、浅色阀座/密封圈、阀座固定边界和 90 度启闭状态。",
          camera: [-0.46, 0.215, 1.0],
          target: [-0.02, 0.028, 0.0],
          productYaw: -6,
          productX: 0.03,
          productY: -0.024,
          zoom: 1.03,
          exposure: 0.8,
          fill: 0.78,
        },
      ];

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, RENDER_WIDTH / RENDER_HEIGHT, 0.01, 6);
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.82;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = true;

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;

      const productRig = new THREE.Group();
      const modelRoot = new THREE.Group();
      productRig.add(modelRoot);
      scene.add(productRig);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(4.25, 2.55),
        new THREE.ShadowMaterial({ color: 0x8f9698, opacity: 0.075 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0.08, -0.44, -0.04);
      floor.material.depthWrite = false;
      floor.renderOrder = -10;
      floor.receiveShadow = true;
      floor.visible = false;
      scene.add(floor);

      const backdrop = new THREE.Mesh(
        new THREE.PlaneGeometry(5.4, 3.1),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.84 }),
      );
      backdrop.position.set(0.18, 0.45, -1.35);
      backdrop.visible = false;
      scene.add(backdrop);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xc8cdd0, 1.12);
      const key = new THREE.DirectionalLight(0xffffff, 3.85);
      key.position.set(-0.72, 0.92, 1.22);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 0.1;
      key.shadow.camera.far = 5;
      key.shadow.camera.left = -1.35;
      key.shadow.camera.right = 1.35;
      key.shadow.camera.top = 1.05;
      key.shadow.camera.bottom = -1.05;
      const topStrip = new THREE.DirectionalLight(0xffffff, 1.55);
      topStrip.position.set(-0.12, 1.08, 0.52);
      const rim = new THREE.DirectionalLight(0xf2f7ff, 2.18);
      rim.position.set(0.82, 0.46, -0.95);
      const sideFill = new THREE.DirectionalLight(0xdce6ea, 0.78);
      sideFill.position.set(0.46, 0.06, 0.92);
      const ballGlint = new THREE.PointLight(0xffffff, 1.65, 1.1, 2);
      ballGlint.position.set(-0.06, 0.16, 0.36);
      scene.add(hemi, key, topStrip, rim, sideFill, ballGlint);

      function makeNoiseTexture(seedOffset) {
        const size = 256;
        const data = new Uint8Array(size * size * 4);
        let seed = 1447 + seedOffset;
        function random() {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        }
        for (let index = 0; index < size * size; index += 1) {
          const value = 170 + Math.floor(random() * 46);
          data[index * 4] = value;
          data[index * 4 + 1] = value;
          data[index * 4 + 2] = value;
          data[index * 4 + 3] = 255;
        }
        const texture = new THREE.DataTexture(data, size, size);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(8, 8);
        texture.needsUpdate = true;
        return texture;
      }

      const shellRoughness = makeNoiseTexture(1);
      const fastenerRoughness = makeNoiseTexture(2);

      const stainlessShellMat = new THREE.MeshPhysicalMaterial({
        color: 0xb9bfbd,
        metalness: 1,
        roughness: 0.26,
        clearcoat: 0.3,
        clearcoatRoughness: 0.24,
        envMapIntensity: 1.34,
        roughnessMap: shellRoughness,
      });
      const machinedDriveMat = new THREE.MeshPhysicalMaterial({
        color: 0xc7ccca,
        metalness: 1,
        roughness: 0.2,
        clearcoat: 0.32,
        clearcoatRoughness: 0.18,
        envMapIntensity: 1.48,
      });
      const polishedBallMat = new THREE.MeshPhysicalMaterial({
        color: 0xdfe4e3,
        metalness: 1,
        roughness: 0.12,
        clearcoat: 0.64,
        clearcoatRoughness: 0.12,
        envMapIntensity: 1.64,
      });
      const softSealMat = new THREE.MeshPhysicalMaterial({
        color: 0xd9d4c8,
        metalness: 0,
        roughness: 0.42,
        clearcoat: 0.08,
        clearcoatRoughness: 0.44,
        envMapIntensity: 0.55,
        transparent: true,
        opacity: 0.98,
      });
      const fastenerMat = new THREE.MeshPhysicalMaterial({
        color: 0xd3d8d6,
        metalness: 1,
        roughness: 0.18,
        clearcoat: 0.36,
        clearcoatRoughness: 0.16,
        envMapIntensity: 1.56,
        roughnessMap: fastenerRoughness,
      });

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync("../fixed-ball-valve.glb");
      modelRoot.add(gltf.scene);

      const sourceBox = new THREE.Box3().setFromObject(gltf.scene);
      const sourceCenter = sourceBox.getCenter(new THREE.Vector3());
      const sourceSize = sourceBox.getSize(new THREE.Vector3());
      gltf.scene.position.sub(sourceCenter);
      modelRoot.scale.setScalar(1.12);

      const partGroups = {
        leftBody: new THREE.Group(),
        rightBody: new THREE.Group(),
        centerBody: new THREE.Group(),
        ball: new THREE.Group(),
        seat: new THREE.Group(),
        upperDrive: new THREE.Group(),
        lowerSupport: new THREE.Group(),
        fastener: new THREE.Group(),
      };

      for (const [id, group] of Object.entries(partGroups)) {
        group.name = `goal16-${id}-group`;
        modelRoot.add(group);
      }

      const center = sourceCenter.clone();
      const size = sourceSize.clone();
      const classified = [];

      function classify(partCenter, partSize) {
        const diagonal = partSize.length();
        const nearBallX = Math.abs(partCenter.x - center.x) < size.x * 0.24;
        const nearBallZ = Math.abs(partCenter.z - center.z) < size.z * 0.48;
        const yDelta = partCenter.y - center.y;
        const maxExtent = Math.max(partSize.x, partSize.y, partSize.z);
        const minExtent = Math.min(partSize.x, partSize.y, partSize.z);
        const extentRatio = minExtent / maxExtent;
        const sphereLike = extentRatio > 0.68;
        const thinAxialSeat =
          nearBallX &&
          nearBallZ &&
          diagonal > 0.09 &&
          diagonal < 0.34 &&
          extentRatio < 0.24 &&
          partSize.x < partSize.y * 0.24 &&
          partSize.x < partSize.z * 0.24;
        const trueBallCore =
          nearBallX &&
          nearBallZ &&
          sphereLike &&
          diagonal > 0.29 &&
          diagonal < 0.33 &&
          partSize.x > size.x * 0.32 &&
          yDelta > -size.y * 0.23 &&
          yDelta < size.y * 0.03;

        if (trueBallCore) return "ball";
        if (diagonal < 0.036) return "fastener";
        if (nearBallX && yDelta > size.y * 0.06 && diagonal < 0.18) return "upperDrive";
        if (nearBallX && yDelta > size.y * 0.2 && diagonal < 0.3) return "upperDrive";
        if (nearBallX && yDelta < -size.y * 0.23 && diagonal < 0.18) return "lowerSupport";
        if (thinAxialSeat) return "seat";
        if (nearBallX && diagonal < 0.12) return "seat";
        if (partCenter.x < center.x - size.x * 0.13) return "leftBody";
        if (partCenter.x > center.x + size.x * 0.13) return "rightBody";
        return "centerBody";
      }

      gltf.scene.traverse((node) => {
        if (!node.isMesh) return;
        const box = new THREE.Box3().setFromObject(node);
        const partCenter = box.getCenter(new THREE.Vector3());
        const partSize = box.getSize(new THREE.Vector3());
        const group = classify(partCenter, partSize);
        const material =
          group === "ball" ? polishedBallMat.clone() :
          group === "seat" ? softSealMat.clone() :
          group === "fastener" ? fastenerMat.clone() :
          group === "upperDrive" || group === "lowerSupport" ? machinedDriveMat.clone() :
          stainlessShellMat.clone();
        if (node.geometry) {
          node.geometry.computeVertexNormals();
        }
        node.material = material;
        node.castShadow = true;
        node.receiveShadow = true;
        classified.push({
          node,
          group,
          localCenter: partCenter.clone().sub(sourceCenter),
        });
      });

      modelRoot.updateMatrixWorld(true);
      for (const item of classified) {
        partGroups[item.group].attach(item.node);
      }
      modelRoot.updateMatrixWorld(true);

      const records = classified.map((item) => ({
        node: item.node,
        group: item.group,
        basePosition: item.node.position.clone(),
        baseRotation: item.node.rotation.clone(),
        localCenter: item.localCenter,
      }));

      const groupCounts = records.reduce((acc, record) => {
        acc[record.group] = (acc[record.group] || 0) + 1;
        return acc;
      }, {});

      function applyAnimationState(animationState) {
        for (const group of Object.values(partGroups)) {
          group.position.set(0, 0, 0);
          group.rotation.set(0, 0, 0);
        }

        partGroups.leftBody.position.x = -animationState.shellSplit * 0.235;
        partGroups.rightBody.position.x = animationState.shellSplit * 0.235;
        partGroups.upperDrive.position.y = animationState.stemLift * 0.155;
        partGroups.upperDrive.position.z = animationState.stemLift * 0.035;
        partGroups.lowerSupport.position.y = -animationState.lowerDrop * 0.132;
        partGroups.lowerSupport.position.z = -animationState.lowerDrop * 0.025;
        partGroups.ball.rotation.y = animationState.ballTurn * THREE.MathUtils.degToRad(90);

        for (const record of records) {
          const offset = new THREE.Vector3();
          const xSign = Math.sign(record.localCenter.x) || 1;
          const ySign = Math.sign(record.localCenter.y) || 1;
          const zSign = Math.sign(record.localCenter.z) || 1;

          if (record.group === "seat") {
            offset.x += xSign * animationState.seatSpread * 0.1;
            offset.z += zSign * animationState.seatSpread * 0.024;
          } else if (record.group === "fastener") {
            offset.x += xSign * animationState.fastenerSpread * 0.074;
            offset.y += ySign * animationState.fastenerSpread * 0.032;
            offset.z += zSign * animationState.fastenerSpread * 0.04;
          }

          record.node.position.copy(record.basePosition).add(offset);
          record.node.rotation.copy(record.baseRotation);
        }
      }

      function applyStillState(stillState) {
        const animationState = ANIMATION_STATES[stillState.stateId];
        applyAnimationState(animationState);
        productRig.position.set(stillState.productX, stillState.productY, 0);
        productRig.rotation.set(0, THREE.MathUtils.degToRad(stillState.productYaw), 0);
        productRig.scale.setScalar(stillState.zoom);
        renderer.toneMappingExposure = stillState.exposure;
        sideFill.intensity = stillState.fill;
        camera.position.fromArray(stillState.camera);
        camera.lookAt(new THREE.Vector3().fromArray(stillState.target));
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      function setStill(index) {
        const bounded = Math.max(0, Math.min(STILL_STATES.length - 1, Math.round(index)));
        const stillState = STILL_STATES[bounded];
        applyStillState(stillState);
        return {
          ...stillState,
          animationState: ANIMATION_STATES[stillState.stateId],
        };
      }

      function setAnimationState(stateId) {
        const animationState = ANIMATION_STATES[stateId] || ANIMATION_STATES.assembled;
        applyAnimationState(animationState);
        renderer.render(scene, camera);
        return animationState;
      }

      applyStillState(STILL_STATES[0]);
      status.textContent = "ready";

      window.__GOAL16_STAINLESS_STATES__ = {
        waitForReady: async () => ({
          width: RENDER_WIDTH,
          height: RENDER_HEIGHT,
          stillCount: STILL_STATES.length,
          animationStateCount: Object.keys(ANIMATION_STATES).length,
          model: "../fixed-ball-valve.glb",
          modelSha256: "89024869647b3aaf3fe5301694a2753dc87e9dd3d05b41b9c651ef4e9754384b",
          stateSource: "animation-states.json",
          sourceBoundary: "Original STEP, brochure, and fixed-ball-valve.glb are not modified.",
          referenceBoundary: "The supplied floating soft-seal image is used as visual material and explosion-order reference only, not as a fixed-valve mechanical claim.",
          renderBoundary: "Goal 16 renders 4K stainless catalogue stills and reusable states only; no 240-frame release sequence and no homepage integration.",
          materialThesis: "high-key stainless shell and flanges, polished stainless ball, light soft-seat rings, bright machined stem and fasteners",
          groupCounts,
          ballIsolation: {
            expectedBallMeshCount: 1,
            actualBallMeshCount: groupCounts.ball || 0,
            invariant: "Only the true ball core receives ballTurn; valve seats and seat seals remain fixed soft-seal material groups.",
          },
          animationStates: Object.values(ANIMATION_STATES),
          states: STILL_STATES.map(({ id, stateId, name, filename, purpose }) => ({ id, stateId, name, filename, purpose })),
          truthBoundary: "No pressure, flow rate, zero-leakage, fire-safe, anti-static, DBB/DIB, material grade, or medium claim is made.",
        }),
        setStill,
        setAnimationState,
        captureStill: (index) => {
          const state = setStill(index);
          return {
            ...state,
            pngDataUrl: canvas.toDataURL("image/png"),
          };
        },
        states: STILL_STATES,
        animationStates: ANIMATION_STATES,
      };
    </script>
  </body>
</html>
