          noteTitle: "回到完整产品",
          noteBody: "功能说明收束，回到可采购的完整不锈钢产品。",
          shellSplit: 0,
          seatSpread: 0,

          camera: [-0.54, 0.245, 1.5],
          target: [0.012, 0.04, 0.0],
        },
        {
          frame: 95,
          name: "最终商业 hold",
          noteTitle: "首页终帧",
          noteBody: "终帧是完整产品 hold；不接入首页，不生成 240 帧。",
          shellSplit: 0,
          seatSpread: 0,
          stemLift: 0,
          lowerDrop: 0,
          fastenerSpread: 0,
          ballTurn: 1,
          productYaw: 6,
          productX: 0.16,
          anatomyOpacity: 0,
          axisOpacity: 0,
          flowOpacity: 0,
          flowProgress: 1,
          camera: [-0.54, 0.245, 1.5],
          target: [0.012, 0.04, 0.0],
        },
      ];

      const stage = document.querySelector("#stage");
      const canvas = document.querySelector("#hero-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(960, 540, false);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, 960 / 540, 0.01, 8);
      const productRig = new THREE.Group();
      const modelRoot = new THREE.Group();
      productRig.add(modelRoot);
      scene.add(productRig);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(2.4, 1.45),
        new THREE.ShadowMaterial({ color: 0x172026, opacity: 0.15 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0.16, -0.32, 0.04);
      floor.receiveShadow = true;
      scene.add(floor);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x9fa7ab, 1.32);
      const key = new THREE.DirectionalLight(0xffffff, 2.86);
      key.position.set(-0.72, 0.86, 1.18);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.near = 0.1;
      key.shadow.camera.far = 4;
      key.shadow.camera.left = -1.4;
      key.shadow.camera.right = 1.4;
      key.shadow.camera.top = 1.1;
      key.shadow.camera.bottom = -1.1;
      const rim = new THREE.DirectionalLight(0xddeeff, 2.45);
      rim.position.set(0.9, 0.38, -0.88);
      const coolFill = new THREE.DirectionalLight(0xc9d8df, 0.95);
      coolFill.position.set(0.25, -0.2, 0.65);
      const ballGlint = new THREE.PointLight(0xffffff, 0.65, 1.8);
      ballGlint.position.set(0.1, 0.12, 0.42);
      scene.add(hemi, key, rim, coolFill, ballGlint);

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync("../fixed-ball-valve.glb");
      modelRoot.add(gltf.scene);

      const sourceBox = new THREE.Box3().setFromObject(gltf.scene);
      const sourceCenter = sourceBox.getCenter(new THREE.Vector3());
      const sourceSize = sourceBox.getSize(new THREE.Vector3());
      gltf.scene.position.sub(sourceCenter);
      modelRoot.scale.setScalar(1.08);

      const steelBodyMat = new THREE.MeshPhysicalMaterial({
        color: 0x697176,
        metalness: 0.92,
        roughness: 0.28,
        clearcoat: 0.46,
        clearcoatRoughness: 0.32,
      });
      const darkSteelMat = new THREE.MeshPhysicalMaterial({
        color: 0x30383d,
        metalness: 0.88,
        roughness: 0.34,
        clearcoat: 0.28,
      });
      const ballMat = new THREE.MeshPhysicalMaterial({
        color: 0xd1d6d8,
        metalness: 0.96,
        roughness: 0.18,
        clearcoat: 0.58,
        clearcoatRoughness: 0.18,
      });
      const sealMat = new THREE.MeshPhysicalMaterial({
        color: 0x242b2f,
        metalness: 0.66,
        roughness: 0.42,
        clearcoat: 0.12,
      });
      const fastenerMat = new THREE.MeshPhysicalMaterial({
        color: 0x8b9498,
        metalness: 0.94,
        roughness: 0.24,
        clearcoat: 0.34,
      });

      const partGroups = {
        leftBody: new THREE.Group(),
        rightBody: new THREE.Group(),
        centerBody: new THREE.Group(),
        ball: new THREE.Group(),
        seat: new THREE.Group(),
        upperDrive: new THREE.Group(),
        lowerSupport: new THREE.Group(),
        fastener: new THREE.Group(),
      };

      for (const [id, group] of Object.entries(partGroups)) {
        group.name = `goal14-${id}-group`;
        modelRoot.add(group);
      }

      const center = sourceCenter.clone();
      const size = sourceSize.clone();
      const classified = [];

      function classify(partCenter, partSize) {
        const diagonal = partSize.length();
        const nearBallX = Math.abs(partCenter.x - center.x) < size.x * 0.24;
        const nearBallZ = Math.abs(partCenter.z - center.z) < size.z * 0.48;
        const yDelta = partCenter.y - center.y;
        const maxExtent = Math.max(partSize.x, partSize.y, partSize.z);
        const minExtent = Math.min(partSize.x, partSize.y, partSize.z);
        const extentRatio = minExtent / maxExtent;
        const sphereLike = extentRatio > 0.68;
        const thinAxialSeat =
          nearBallX &&
          nearBallZ &&
          diagonal > 0.09 &&
          diagonal < 0.34 &&
          extentRatio < 0.24 &&
          partSize.x < partSize.y * 0.24 &&
          partSize.x < partSize.z * 0.24;
        const trueBallCore =
          nearBallX &&
          nearBallZ &&
          sphereLike &&
          diagonal > 0.29 &&
          diagonal < 0.33 &&
          partSize.x > size.x * 0.32 &&
          yDelta > -size.y * 0.23 &&
          yDelta < size.y * 0.03;

        if (trueBallCore) return "ball";
        if (diagonal < 0.036) return "fastener";
        if (nearBallX && yDelta > size.y * 0.06 && diagonal < 0.18) return "upperDrive";
        if (nearBallX && yDelta > size.y * 0.2 && diagonal < 0.3) return "upperDrive";
        if (nearBallX && yDelta < -size.y * 0.23 && diagonal < 0.18) return "lowerSupport";
        if (thinAxialSeat) return "seat";
        if (nearBallX && diagonal < 0.12) return "seat";
        if (partCenter.x < center.x - size.x * 0.13) return "leftBody";
        if (partCenter.x > center.x + size.x * 0.13) return "rightBody";
        return "centerBody";
      }

      gltf.scene.traverse((node) => {
        if (!node.isMesh) return;
        const box = new THREE.Box3().setFromObject(node);
        const partCenter = box.getCenter(new THREE.Vector3());
        const partSize = box.getSize(new THREE.Vector3());
        const group = classify(partCenter, partSize);
        const material =
          group === "ball" ? ballMat.clone() :
          group === "seat" ? sealMat.clone() :
          group === "fastener" ? fastenerMat.clone() :
          group === "leftBody" || group === "rightBody" ? darkSteelMat.clone() :
          steelBodyMat.clone();
        node.material = material;
        node.castShadow = true;
        node.receiveShadow = true;
        classified.push({
          node,
          group,
          localCenter: partCenter.clone().sub(sourceCenter),
          baseWorldCenter: partCenter,
        });
      });

      modelRoot.updateMatrixWorld(true);
      for (const item of classified) {
        partGroups[item.group].attach(item.node);
      }
      modelRoot.updateMatrixWorld(true);

      const records = classified.map((item) => ({
        node: item.node,
        group: item.group,
        basePosition: item.node.position.clone(),
        baseRotation: item.node.rotation.clone(),
        localCenter: item.localCenter,
      }));

      const groupCounts = records.reduce((acc, record) => {
        acc[record.group] = (acc[record.group] || 0) + 1;
        return acc;
      }, {});

      function clamp(value) {
        return Math.max(0, Math.min(1, value));
      }

      function smoothstep(value) {
        const t = clamp(value);
        return t * t * (3 - 2 * t);
      }

      function lerp(left, right, t) {
        return left + (right - left) * t;
      }

      function lerpArray(left, right, t) {
        return left.map((value, index) => lerp(value, right[index], t));
      }

      function frameState(frame) {
        let left = KEY_STATES[0];
        let right = KEY_STATES[KEY_STATES.length - 1];
        for (let index = 0; index < KEY_STATES.length - 1; index += 1) {
          const a = KEY_STATES[index];
          const b = KEY_STATES[index + 1];
          if (frame >= a.frame && frame <= b.frame) {
            left = a;
            right = b;
            break;
          }
        }
        const segmentLength = Math.max(1, right.frame - left.frame);
        const t = smoothstep((frame - left.frame) / segmentLength);
        const numericKeys = [
          "shellSplit",
          "seatSpread",
          "stemLift",
          "lowerDrop",
          "fastenerSpread",
          "ballTurn",
          "productYaw",
          "productX",
          "anatomyOpacity",
          "axisOpacity",
          "flowOpacity",
          "flowProgress",
        ];
        const state = {
          frame,
          name: frame < right.frame ? left.name : right.name,
          noteTitle: frame < right.frame ? left.noteTitle : right.noteTitle,
          noteBody: frame < right.frame ? left.noteBody : right.noteBody,
          camera: lerpArray(left.camera, right.camera, t),
          target: lerpArray(left.target, right.target, t),
        };
        for (const keyName of numericKeys) {
          state[keyName] = lerp(left[keyName] || 0, right[keyName] || 0, t);
        }
        return state;
      }

      function applyState(state) {
        productRig.position.set(state.productX, -0.035, 0);
        productRig.rotation.set(0, THREE.MathUtils.degToRad(state.productYaw), 0);

        for (const group of Object.values(partGroups)) {
          group.position.set(0, 0, 0);
          group.rotation.set(0, 0, 0);
        }

        partGroups.leftBody.position.x = -state.shellSplit * 0.23;
        partGroups.rightBody.position.x = state.shellSplit * 0.23;
        partGroups.upperDrive.position.y = state.stemLift * 0.15;
        partGroups.upperDrive.position.z = state.stemLift * 0.03;
        partGroups.lowerSupport.position.y = -state.lowerDrop * 0.13;
        partGroups.lowerSupport.position.z = -state.lowerDrop * 0.025;
        partGroups.ball.rotation.y = state.ballTurn * THREE.MathUtils.degToRad(90);

        for (const record of records) {
          const offset = new THREE.Vector3();
          const xSign = Math.sign(record.localCenter.x) || 1;
          const ySign = Math.sign(record.localCenter.y) || 1;
          const zSign = Math.sign(record.localCenter.z) || 1;

          if (record.group === "seat") {
            offset.x += xSign * state.seatSpread * 0.095;
            offset.z += zSign * state.seatSpread * 0.022;
          } else if (record.group === "fastener") {
            offset.x += xSign * state.fastenerSpread * 0.072;
            offset.y += ySign * state.fastenerSpread * 0.032;
            offset.z += zSign * state.fastenerSpread * 0.04;
          }

          record.node.position.copy(record.basePosition).add(offset);
          record.node.rotation.copy(record.baseRotation);
          record.node.material.transparent = false;
          record.node.material.opacity = 1;
          if (record.group === "ball") {
            record.node.material.emissive = new THREE.Color(0xdce9ef).multiplyScalar(state.axisOpacity * 0.08 + state.flowOpacity * 0.08);
          } else if (record.group === "seat") {
            record.node.material.emissive = new THREE.Color(0xdce9ef).multiplyScalar(state.axisOpacity * 0.032);
          } else if (record.group === "fastener") {
            record.node.material.emissive = new THREE.Color(0xffffff).multiplyScalar(state.anatomyOpacity * 0.018);
          }
        }

        camera.position.fromArray(state.camera);
        camera.lookAt(new THREE.Vector3().fromArray(state.target));
        key.intensity = 2.2 + state.axisOpacity * 0.32 + state.flowOpacity * 0.18;
        rim.intensity = 1.75 + state.axisOpacity * 0.74 + state.flowOpacity * 0.28;
        ballGlint.intensity = 0.42 + state.axisOpacity * 0.55 + state.flowOpacity * 0.25;

        stage.style.setProperty("--anatomy-opacity", String(state.anatomyOpacity));
        stage.style.setProperty("--axis-opacity", String(state.axisOpacity));
        stage.style.setProperty("--flow-opacity", String(state.flowOpacity));
        stage.style.setProperty("--flow-glow", String(state.flowOpacity));
        stage.style.setProperty("--flow-offset", String(220 - state.flowProgress * 220));
        document.querySelector("#frame-id").textContent = String(state.frame + 1).padStart(3, "0");
        document.querySelector("#frame-name").textContent = state.name;
        document.querySelector("#side-title").textContent = state.noteTitle;
        document.querySelector("#side-body").textContent = state.noteBody;

        renderer.render(scene, camera);
      }

      const frameStates = Array.from({ length: FRAME_COUNT }, (_, frame) => frameState(frame));
      applyState(frameStates[0]);

      window.__GOAL14_BLOCKING__ = {
        waitForReady: async () => ({
          frameCount: FRAME_COUNT,
          fps: FPS,
          durationSeconds: FRAME_COUNT / FPS,
          width: 960,
          height: 540,
          model: "../fixed-ball-valve.glb",
          structureReference: "../fixed-ball-valve-structure-reference.jpg",
          finalHoldFrames: [90, 95],
          frameSequenceRendered: false,
          fullReleaseFrameCount: 0,
          grammar: "single true ball core anchored multi-direction anatomy plus 90-degree quarter-turn; valve seats remain fixed during ball rotation; no 240-frame output",
          meshCount: records.length,
          groupCounts,
          ballIsolation: {
            expectedBallMeshCount: 1,
            actualBallMeshCount: groupCounts.ball || 0,
            invariant: "Only the true ball core rotates; valve seats, seat seals, shell, support parts, and fasteners do not inherit ballTurn.",
          },
          truthBoundary: "flow lines express path only; no pressure, flow rate, zero-leakage, material grade, DBB/DIB, or real maintenance claims",
        }),
        setFrame: (frame) => {
          const bounded = Math.max(0, Math.min(FRAME_COUNT - 1, Math.round(frame)));
          const state = frameStates[bounded];
          applyState(state);
          return state;
        },
        captureFrame: (frame) => {
          const bounded = Math.max(0, Math.min(FRAME_COUNT - 1, Math.round(frame)));
          const state = frameStates[bounded];
          applyState(state);
          return {
            ...state,
            pngDataUrl: canvas.toDataURL("image/png"),
          };
        },
        frameStates,
      };
    </script>
  </body>
</html>
