<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Goal 15 Material Lookdev Preview</title>
    <style>
      :root {
        color-scheme: light;
        --studio-top: #f7f8f7;
        --studio-mid: #e7ebeb;
        --studio-floor: #d2d8d9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 68% 22%, rgba(255, 255, 255, 0.92), transparent 28%),
          linear-gradient(180deg, var(--studio-top) 0%, var(--studio-mid) 58%, var(--studio-floor) 100%);
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #hero-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Goal 15 UI-free material lookdev render stage">
      <canvas id="hero-canvas"></canvas>
    </main>
    <div id="status">loading</div>

    <script type="module">
      import * as THREE from "../../../../local/templates/roke/assets/js/three/three.module.js";
      import { GLTFLoader } from "../../../../local/templates/roke/assets/js/three/GLTFLoader.js";
      import { RoomEnvironment } from "../../../../local/templates/roke/assets/js/three/RoomEnvironment.js";

      const RENDER_WIDTH = 3840;
      const RENDER_HEIGHT = 2160;
      const canvas = document.querySelector("#hero-canvas");
      const stage = document.querySelector("#stage");
      const status = document.querySelector("#status");

      const STILL_STATES = [
        {
          id: "master-product",
          name: "完整产品商业主视角",
          filename: "01-master-product-4k.png",
          purpose: "验证黑色阀体、抛光球芯和小五金在完整采购视角下是否具有工业广告质感。",
          camera: [-0.56, 0.255, 1.28],
          target: [0.0, 0.04, 0.0],
          productYaw: 6,
          productX: -0.01,
          productY: -0.01,
          zoom: 1,
          shellSplit: 0,
          seatSpread: 0,
          stemLift: 0,
          lowerDrop: 0,
          fastenerSpread: 0,
          ballTurn: 1,
          exposure: 1.04,
          fill: 0.58,
        },
        {
          id: "ball-seat-core",
          name: "球芯与阀座材质近景",
          filename: "02-ball-seat-core-4k.png",
          purpose: "验证球芯抛光不锈钢、阀座/密封深色低反射、阀座固定不随球转的材质分层。",
          camera: [-0.46, 0.23, 1.04],
          target: [-0.012, 0.028, 0.0],
          productYaw: -7,
          productX: 0.02,
          productY: -0.03,
          zoom: 1,
          shellSplit: 0.66,
          seatSpread: 0.94,
          stemLift: 0.46,
          lowerDrop: 0.36,
          fastenerSpread: 0.28,
          ballTurn: 0,
          exposure: 0.98,
          fill: 0.72,
        },
        {
          id: "flange-fastener-detail",
          name: "法兰与螺栓细节近景",
          filename: "03-flange-fastener-detail-4k.png",
          purpose: "验证法兰边缘、孔位、螺栓和接触阴影是否能撑起高端工业产品细节。",
          camera: [-0.64, 0.075, 0.76],
          target: [-0.18, -0.035, 0.02],
          productYaw: 8,
          productX: 0.02,
          productY: -0.005,
          zoom: 1.14,
          shellSplit: 0.12,
          seatSpread: 0.05,
          stemLift: 0,
          lowerDrop: 0,
          fastenerSpread: 0.04,
          ballTurn: 1,
          exposure: 0.96,
          fill: 0.48,
        },
      ];

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, RENDER_WIDTH / RENDER_HEIGHT, 0.01, 6);
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(1);
      renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.04;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = true;

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const productRig = new THREE.Group();
      const modelRoot = new THREE.Group();
      productRig.add(modelRoot);
      scene.add(productRig);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(4.8, 3.2),
        new THREE.ShadowMaterial({ color: 0x111820, opacity: 0.18 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0.08, -0.318, 0.02);
      floor.receiveShadow = true;
      scene.add(floor);

      const softBackdrop = new THREE.Mesh(
        new THREE.PlaneGeometry(5.4, 3.1),
        new THREE.MeshBasicMaterial({ color: 0xf3f5f5, transparent: true, opacity: 0.72 }),
      );
      softBackdrop.position.set(0.22, 0.42, -1.35);
      scene.add(softBackdrop);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xa9b0b3, 1.15);
      const key = new THREE.DirectionalLight(0xffffff, 4.6);
      key.position.set(-0.7, 0.9, 1.28);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 0.1;
      key.shadow.camera.far = 5;
      key.shadow.camera.left = -1.2;
      key.shadow.camera.right = 1.2;
      key.shadow.camera.top = 1.0;
      key.shadow.camera.bottom = -1.0;
      const longStrip = new THREE.DirectionalLight(0xeaf6ff, 2.4);
      longStrip.position.set(0.92, 0.32, 0.92);
      const rim = new THREE.DirectionalLight(0xdbe8ee, 3.2);
      rim.position.set(0.82, 0.45, -0.95);
      const lowFill = new THREE.DirectionalLight(0xc4d1d7, 0.7);
      lowFill.position.set(-0.18, -0.18, 0.7);
      const ballGlint = new THREE.PointLight(0xffffff, 3.2, 1.2, 2);
      ballGlint.position.set(-0.08, 0.18, 0.38);
      scene.add(hemi, key, longStrip, rim, lowFill, ballGlint);

      function makeNoiseTexture() {
        const size = 256;
        const data = new Uint8Array(size * size * 4);
        for (let index = 0; index < size * size; index += 1) {
          const value = 168 + Math.floor(Math.random() * 42);
          data[index * 4] = value;
          data[index * 4 + 1] = value;
          data[index * 4 + 2] = value;
          data[index * 4 + 3] = 255;
        }
        const texture = new THREE.DataTexture(data, size, size);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(6, 6);
        texture.needsUpdate = true;
        return texture;
      }

      const fineRoughness = makeNoiseTexture();

      const blackBodyMat = new THREE.MeshPhysicalMaterial({
        color: 0x11181c,
        metalness: 0.82,
        roughness: 0.31,
        clearcoat: 0.38,
        clearcoatRoughness: 0.28,
        envMapIntensity: 1.38,
        roughnessMap: fineRoughness,
      });
      const satinSteelMat = new THREE.MeshPhysicalMaterial({
        color: 0x7e8588,
        metalness: 0.96,
        roughness: 0.24,
        clearcoat: 0.26,
        clearcoatRoughness: 0.22,
        envMapIntensity: 1.46,
      });
      const polishedBallMat = new THREE.MeshPhysicalMaterial({
        color: 0xe2e6e7,
        metalness: 1,
        roughness: 0.15,
        clearcoat: 0.68,
        clearcoatRoughness: 0.12,
        envMapIntensity: 1.82,
      });
      const seatSealMat = new THREE.MeshPhysicalMaterial({
        color: 0x070a0c,
        metalness: 0.24,
        roughness: 0.58,
        clearcoat: 0.06,
        envMapIntensity: 0.82,
      });
      const boltMat = new THREE.MeshPhysicalMaterial({
        color: 0xb2b8bb,
        metalness: 1,
        roughness: 0.2,
        clearcoat: 0.32,
        clearcoatRoughness: 0.17,
        envMapIntensity: 1.64,
      });

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync("../fixed-ball-valve.glb");
      modelRoot.add(gltf.scene);

      const sourceBox = new THREE.Box3().setFromObject(gltf.scene);
      const sourceCenter = sourceBox.getCenter(new THREE.Vector3());
      const sourceSize = sourceBox.getSize(new THREE.Vector3());
      gltf.scene.position.sub(sourceCenter);
      modelRoot.scale.setScalar(1.12);

      const partGroups = {
        leftBody: new THREE.Group(),
        rightBody: new THREE.Group(),
        centerBody: new THREE.Group(),
        ball: new THREE.Group(),
        seat: new THREE.Group(),
        upperDrive: new THREE.Group(),
        lowerSupport: new THREE.Group(),
        fastener: new THREE.Group(),
      };

      for (const [id, group] of Object.entries(partGroups)) {
        group.name = `goal15-${id}-group`;
        modelRoot.add(group);
      }

      const center = sourceCenter.clone();
      const size = sourceSize.clone();
      const classified = [];

      function classify(partCenter, partSize) {
        const diagonal = partSize.length();
        const nearBallX = Math.abs(partCenter.x - center.x) < size.x * 0.24;
        const nearBallZ = Math.abs(partCenter.z - center.z) < size.z * 0.48;
        const yDelta = partCenter.y - center.y;
        const maxExtent = Math.max(partSize.x, partSize.y, partSize.z);
        const minExtent = Math.min(partSize.x, partSize.y, partSize.z);
        const extentRatio = minExtent / maxExtent;
        const sphereLike = extentRatio > 0.68;
        const thinAxialSeat =
          nearBallX &&
          nearBallZ &&
          diagonal > 0.09 &&
          diagonal < 0.34 &&
          extentRatio < 0.24 &&
          partSize.x < partSize.y * 0.24 &&
          partSize.x < partSize.z * 0.24;
        const trueBallCore =
          nearBallX &&
          nearBallZ &&
          sphereLike &&
          diagonal > 0.29 &&
          diagonal < 0.33 &&
          partSize.x > size.x * 0.32 &&
          yDelta > -size.y * 0.23 &&
          yDelta < size.y * 0.03;

        if (trueBallCore) return "ball";
        if (diagonal < 0.036) return "fastener";
        if (nearBallX && yDelta > size.y * 0.06 && diagonal < 0.18) return "upperDrive";
        if (nearBallX && yDelta > size.y * 0.2 && diagonal < 0.3) return "upperDrive";
        if (nearBallX && yDelta < -size.y * 0.23 && diagonal < 0.18) return "lowerSupport";
        if (thinAxialSeat) return "seat";
        if (nearBallX && diagonal < 0.12) return "seat";
        if (partCenter.x < center.x - size.x * 0.13) return "leftBody";
        if (partCenter.x > center.x + size.x * 0.13) return "rightBody";
        return "centerBody";
      }

      gltf.scene.traverse((node) => {
        if (!node.isMesh) return;
        const box = new THREE.Box3().setFromObject(node);
        const partCenter = box.getCenter(new THREE.Vector3());
        const partSize = box.getSize(new THREE.Vector3());
        const group = classify(partCenter, partSize);
        const material =
          group === "ball" ? polishedBallMat.clone() :
          group === "seat" ? seatSealMat.clone() :
          group === "fastener" ? boltMat.clone() :
          group === "upperDrive" || group === "lowerSupport" ? satinSteelMat.clone() :
          blackBodyMat.clone();
        if (node.geometry) {
          node.geometry.computeVertexNormals();
        }
        node.material = material;
        node.castShadow = true;
        node.receiveShadow = true;
        classified.push({
          node,
          group,
          localCenter: partCenter.clone().sub(sourceCenter),
        });
      });

      modelRoot.updateMatrixWorld(true);
      for (const item of classified) {
        partGroups[item.group].attach(item.node);
      }
      modelRoot.updateMatrixWorld(true);

      const records = classified.map((item) => ({
        node: item.node,
        group: item.group,
        basePosition: item.node.position.clone(),
        baseRotation: item.node.rotation.clone(),
        localCenter: item.localCenter,
      }));

      const groupCounts = records.reduce((acc, record) => {
        acc[record.group] = (acc[record.group] || 0) + 1;
        return acc;
      }, {});

      function applyState(state) {
        productRig.position.set(state.productX, state.productY, 0);
        productRig.rotation.set(0, THREE.MathUtils.degToRad(state.productYaw), 0);
        productRig.scale.setScalar(state.zoom);
        renderer.toneMappingExposure = state.exposure;
        lowFill.intensity = state.fill;

        for (const group of Object.values(partGroups)) {
          group.position.set(0, 0, 0);
          group.rotation.set(0, 0, 0);
        }

        partGroups.leftBody.position.x = -state.shellSplit * 0.23;
        partGroups.rightBody.position.x = state.shellSplit * 0.23;
        partGroups.upperDrive.position.y = state.stemLift * 0.15;
        partGroups.upperDrive.position.z = state.stemLift * 0.03;
        partGroups.lowerSupport.position.y = -state.lowerDrop * 0.13;
        partGroups.lowerSupport.position.z = -state.lowerDrop * 0.025;
        partGroups.ball.rotation.y = state.ballTurn * THREE.MathUtils.degToRad(90);

        for (const record of records) {
          const offset = new THREE.Vector3();
          const xSign = Math.sign(record.localCenter.x) || 1;
          const ySign = Math.sign(record.localCenter.y) || 1;
          const zSign = Math.sign(record.localCenter.z) || 1;

          if (record.group === "seat") {
            offset.x += xSign * state.seatSpread * 0.095;
            offset.z += zSign * state.seatSpread * 0.022;
          } else if (record.group === "fastener") {
            offset.x += xSign * state.fastenerSpread * 0.068;
            offset.y += ySign * state.fastenerSpread * 0.029;
            offset.z += zSign * state.fastenerSpread * 0.038;
          }

          record.node.position.copy(record.basePosition).add(offset);
          record.node.rotation.copy(record.baseRotation);
        }

        camera.position.fromArray(state.camera);
        camera.lookAt(new THREE.Vector3().fromArray(state.target));
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      function setStill(index) {
        const bounded = Math.max(0, Math.min(STILL_STATES.length - 1, Math.round(index)));
        const state = STILL_STATES[bounded];
        applyState(state);
        return state;
      }

      applyState(STILL_STATES[0]);
      status.textContent = "ready";

      window.__GOAL15_LOOKDEV__ = {
        waitForReady: async () => ({
          width: RENDER_WIDTH,
          height: RENDER_HEIGHT,
          stillCount: STILL_STATES.length,
          model: "../fixed-ball-valve.glb",
          modelSha256: "89024869647b3aaf3fe5301694a2753dc87e9dd3d05b41b9c651ef4e9754384b",
          sourceBoundary: "Original STEP and brochure are not modified; this lookdev uses the derived fixed-ball-valve.glb.",
          renderBoundary: "Goal 15 renders 4K material lookdev stills only; no 240-frame release sequence, homepage replacement, or fluid claim.",
          materialThesis: "commercial graphite pressure body, polished stainless ball core, dark fixed seat/seal system, satin machined drive/support, brighter steel fasteners",
          groupCounts,
          ballIsolation: {
            expectedBallMeshCount: 1,
            actualBallMeshCount: groupCounts.ball || 0,
            invariant: "Only the true ball core receives ballTurn; valve seats and seat seals remain fixed material groups.",
          },
          truthBoundary: "No pressure, flow rate, zero-leakage, fire-safe, anti-static, DBB/DIB, material grade, or medium claim is made.",
          states: STILL_STATES.map(({ id, name, filename, purpose }) => ({ id, name, filename, purpose })),
        }),
        setStill,
        captureStill: (index) => {
          const state = setStill(index);
          return {
            ...state,
            pngDataUrl: canvas.toDataURL("image/png"),
          };
        },
        states: STILL_STATES,
      };
    </script>
  </body>
</html>
