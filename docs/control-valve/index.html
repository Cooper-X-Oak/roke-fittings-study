<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DN80 CL2500 气动串级式调节阀五镜头 WebGL Animatic"
    />
    <title>Force Becomes Control — Control Valve Animatic</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../experiment/assets/vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="story" class="story">
      <section class="stage" aria-label="气动串级式调节阀三维叙事">
        <div class="stage__media">
          <img
            id="poster"
            class="poster"
            src="./assets/first-frame-poster.jpg"
            alt="DN80 CL2500 气动串级式调节阀首帧"
          />
          <canvas id="canvas" aria-label="实时三维产品动画"></canvas>
          <div id="occlusion" class="occlusion" aria-hidden="true"></div>
          <div class="vignette" aria-hidden="true"></div>
        </div>

        <header class="masthead">
          <a class="identity" href="../" aria-label="返回实验首页">
            <span class="identity__mark">CV</span>
            <span>FORCE / CONTROL</span>
          </a>
          <button id="play" class="play" type="button">
            <span class="play__dot" aria-hidden="true"></span>
            播放 16 秒 Animatic
          </button>
        </header>

        <article class="copy" aria-live="polite">
          <p id="eyebrow" class="copy__eyebrow">01 / MONUMENT</p>
          <h1 id="title" class="copy__title">驱动力<br />成为控制</h1>
          <p id="body" class="copy__body">一股驱动力，贯穿整台设备。</p>
        </article>

        <div class="timeline" aria-label="五镜头进度">
          <p class="timeline__label">
            <span id="shot-number">01</span>
            <span id="shot-name">MONUMENT</span>
          </p>
          <div class="timeline__rail">
            <span id="timeline-fill" class="timeline__fill"></span>
          </div>
          <ol class="timeline__beats" aria-hidden="true">
            <li></li><li></li><li></li><li></li><li></li>
          </ol>
        </div>

        <p id="loading" class="loading">正在准备六组镜头资产…</p>
        <p class="scroll-cue"><span>SCROLL</span><i></i></p>
        <output id="debug" class="debug" hidden></output>
      </section>
    </main>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
